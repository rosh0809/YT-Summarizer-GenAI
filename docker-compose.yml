version: "3.9"

services:
  summarizer:
    build: .
    ports:
      - "8501:8501"        # localhost:8501 → container:8501
    env_file:
      - .env               # loads your API keys from .env file
    volumes:
      - .:/app             # mounts your local code into container
                           # so code changes reflect without rebuilding
    restart: unless-stopped